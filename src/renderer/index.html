<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>todoz</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 24px;
        background: #fafaf7;
        color: #1a1a1a;
      }
      [data-view="todo-list"] [data-task-list] {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      [data-task] {
        padding: 8px 0;
        border-bottom: 1px solid #eee;
      }
      [data-task-row] {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      [data-task-title] {
        font-weight: 500;
        flex: 1;
      }
      [data-task-due] {
        font-size: 0.85em;
        color: #888;
      }
      [data-task-status="done"] [data-task-title] {
        text-decoration: line-through;
        color: #888;
      }
      [data-subtasks] {
        list-style: none;
        padding-left: 28px;
        margin: 4px 0 0 0;
      }
      [data-subtask] {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 2px 0;
        font-size: 0.95em;
        color: #444;
      }
    </style>
  </head>
  <body>
    <script src="./index.bundle.js"></script>
  </body>
</html>
