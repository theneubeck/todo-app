<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>todoz</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --surface: #f7f9fb;
        --surface-bright: #f7f9fb;
        --surface-container-lowest: #ffffff;
        --surface-container-low: #f2f4f6;
        --surface-container: #eceef0;
        --surface-container-high: #e6e8ea;
        --surface-container-highest: #e0e3e5;
        --surface-variant: #e0e3e5;
        --on-surface: #191c1e;
        --on-surface-variant: #4c4546;
        --outline: #7e7576;
        --outline-variant: #cfc4c5;
        --primary: #000000;
        --on-primary: #ffffff;
        --secondary-container: #d0e1fb;
        --on-secondary-container: #54647a;
        --error-container: #ffdad6;
        --on-error-container: #93000a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--surface);
        color: var(--on-surface);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined';
        font-weight: normal;
        font-style: normal;
        font-size: 20px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        font-feature-settings: 'liga';
      }
      [data-app-shell] {
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100vh;
        width: 100vw;
        overflow: hidden;
      }
      /* Top app bar */
      [data-app-bar] {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 64px;
        padding: 0 24px;
        background: var(--surface);
        border-bottom: 1px solid var(--outline-variant);
        width: 100%;
      }
      [data-brand] {
        font-family: 'Inter', sans-serif;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--primary);
      }
      [data-app-bar-actions] {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      [data-app-bar-actions] button {
        background: transparent;
        border: none;
        cursor: pointer;
        padding: 8px;
        border-radius: 4px;
        color: var(--on-surface);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      [data-app-bar-actions] button:hover {
        background: var(--surface-container-low);
      }
      [data-avatar] {
        width: 32px;
        height: 32px;
        border-radius: 9999px;
        background: var(--surface-variant);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--on-surface-variant);
      }
      /* App body grid */
      [data-app-body] {
        display: grid;
        grid-template-columns: 240px 1fr;
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: relative;
      }
      /* Sidebar */
      [data-sidebar] {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 240px;
        flex-shrink: 0;
        overflow-y: auto;
        border-right: 1px solid var(--outline-variant);
        padding: 16px 8px;
        background: var(--surface);
      }
      a[data-nav-entry] {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 8px 16px;
        border-radius: 4px;
        color: var(--on-surface);
        text-decoration: none;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.02em;
      }
      [data-nav-entry]:hover {
        background: var(--surface-container-low);
      }
      [data-nav-entry][data-nav-active],
      [data-sidebar-entry][data-nav-active] {
        background: var(--surface-container-low);
        color: var(--primary);
        font-weight: 700;
      }
      [data-sidebar-entry] {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 8px 16px;
        border-radius: 4px;
        text-decoration: none;
        color: var(--on-surface);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
      }
      [data-sidebar-entry]:hover {
        background: var(--surface-container-low);
      }
      [data-sidebar-entry][data-pulsing='true'] {
        background: var(--secondary-container);
        color: var(--on-secondary-container);
        transition: background 600ms ease, color 600ms ease;
      }
      [data-nav-entry] .material-symbols-outlined {
        font-size: 20px;
      }
      [data-section] {
        margin-top: 16px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      [data-section-entry] {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 8px 16px;
        border-radius: 4px;
        text-decoration: none;
        color: var(--on-surface);
        font-size: 12px;
        font-weight: 500;
      }
      [data-section-entry]:hover {
        background: var(--surface-container-low);
      }
      [data-section-entry] .material-symbols-outlined {
        font-size: 20px;
        color: var(--on-surface-variant);
      }
      [data-section-header] {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--on-surface-variant);
        padding: 0 16px;
        margin: 0 0 8px 0;
      }
      /* Main pane and chat view share the same grid slot (sibling of sidebar). */
      [data-main-view],
      [data-chat-view] {
        display: flex;
        flex-direction: column;
        gap: 24px;
        min-width: 0;
        overflow-y: auto;
        padding: 24px 32px 96px 32px;
        position: relative;
        background: var(--surface);
      }
      [data-main-header] {
        border-bottom: 1px solid var(--outline-variant);
        padding-bottom: 8px;
        margin-bottom: 8px;
      }
      [data-main-header] h1 {
        font-family: 'Inter', sans-serif;
        font-size: 32px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.2;
        margin: 0 0 4px 0;
        color: var(--primary);
      }
      [data-remaining-count] {
        font-size: 14px;
        color: var(--on-surface-variant);
        margin: 0;
      }
      /* Task card — desktop-layout: border + rounded corners removed; the
         card stretches to fill the main pane width. Row separators per
         DESIGN.md ("Separators: Use 1px borders to divide list items")
         provide visual structure without the outer card outline. */
      [data-task-card] {
        display: flex;
        flex-direction: column;
        border: none;
        border-radius: 0;
        background: transparent;
        max-width: none;
        width: 100%;
      }
      [data-task-list] {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
      }
      [data-group-heading] {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--on-surface-variant);
        padding: 16px 16px 8px 16px;
        margin: 0;
      }
      [data-task] {
        display: flex;
        flex-direction: column;
        border-bottom: 1px solid var(--surface-container-highest);
      }
      [data-task]:last-child {
        border-bottom: none;
      }
      [data-task][data-expanded='true'] {
        background: var(--surface-bright);
      }
      [data-task-row] {
        display: flex;
        align-items: center;
        padding: 8px 16px;
        gap: 8px;
        cursor: pointer;
      }
      [data-task-row]:hover {
        background: var(--surface-container-low);
      }
      [data-chevron] {
        color: var(--on-surface-variant);
        font-size: 20px;
        line-height: 1;
        display: inline-flex;
      }
      [data-task] [data-task-row] [data-checkbox-wrapper] {
        position: relative;
        width: 18px;
        height: 18px;
        margin-right: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      [data-task] [data-task-row] [data-checkbox-wrapper] input[type='checkbox'] {
        margin: 0;
        width: 18px;
        height: 18px;
        accent-color: var(--primary);
      }
      [data-task-title] {
        flex: 1;
        font-size: 14px;
        color: var(--on-surface);
      }
      [data-task-status='done'] [data-task-title] {
        text-decoration: line-through;
        color: var(--on-surface-variant);
      }
      [data-chip] {
        display: inline-flex;
        align-items: center;
        padding: 4px 6px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.02em;
        background: var(--surface-variant);
        color: var(--on-surface-variant);
        border: 1px solid var(--outline-variant);
      }
      [data-chip][data-chip-priority='high'] {
        background: var(--error-container);
        color: var(--on-error-container);
        border: none;
      }
      [data-chip][data-chip-priority='medium'] {
        background: var(--secondary-container);
        color: var(--on-secondary-container);
        border: none;
      }
      [data-task-due] {
        font-size: 12px;
        color: var(--on-surface-variant);
        margin-right: 8px;
      }
      /* Subtasks */
      [data-subtasks] {
        list-style: none;
        padding: 0 16px 8px 64px;
        margin: 0 0 0 26px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      [data-subtasks][data-guide-line] {
        border-left: 2px solid var(--surface-container-highest);
      }
      [data-subtask] {
        display: flex;
        align-items: center;
        padding: 4px;
        border-radius: 4px;
        gap: 8px;
      }
      [data-subtask]:hover {
        background: var(--surface-container-low);
      }
      [data-subtask] [data-checkbox-wrapper] {
        position: relative;
        width: 16px;
        height: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex: 0 0 auto;
      }
      [data-subtask] input[type='checkbox'] {
        width: 16px;
        height: 16px;
        margin: 0;
        accent-color: var(--on-surface-variant);
      }
      [data-subtask-label] {
        font-size: 13px;
        color: var(--on-surface);
        flex: 1;
      }
      [data-subtask-label][data-strikethrough='true'] {
        text-decoration: line-through;
        color: var(--on-surface-variant);
      }
      [data-task-title][data-completed='true'] {
        text-decoration: line-through;
        color: var(--on-surface-variant);
      }
      [data-subtask-title][data-completed='true'] {
        text-decoration: line-through;
        color: var(--on-surface-variant);
      }
      [data-checkbox-wrapper][data-checked='true'] {
        background-color: #16a34a;
        border-radius: 3px;
      }
      [data-checkbox-wrapper][data-checked='true'] input[type='checkbox'] {
        accent-color: #16a34a;
      }
      [data-task][data-expanded='true'] [data-chevron] {
        transform: rotate(90deg);
      }
      [data-set-due] {
        opacity: 0;
        display: inline-flex;
        padding: 2px;
        border-radius: 3px;
        color: var(--outline);
        cursor: pointer;
      }
      [data-set-due] .material-symbols-outlined { font-size: 18px; }
      [data-task-row]:hover [data-set-due] { opacity: 0.5; }
      [data-set-due]:hover { opacity: 1; color: var(--on-surface); background: var(--surface-container); }
      [data-due-input] {
        font-size: 12px;
        border: 1px solid var(--outline-variant);
        border-radius: 4px;
        padding: 2px 6px;
        background: var(--surface-container-low);
        color: var(--on-surface);
        margin-left: 8px;
      }
      [data-remove] {
        opacity: 0;
        display: inline-flex;
        align-items: center;
        padding: 2px;
        margin-left: 4px;
        border-radius: 3px;
        color: var(--outline);
        cursor: pointer;
        user-select: none;
        flex-shrink: 0;
      }
      [data-remove] .material-symbols-outlined {
        font-size: 18px;
      }
      [data-task-row]:hover [data-remove] {
        opacity: 0.5;
      }
      [data-remove]:hover {
        opacity: 1;
        color: var(--on-surface);
        background: var(--surface-container);
      }
      [data-remove='subtask'] .material-symbols-outlined {
        font-size: 16px;
      }
      [data-subtask]:hover [data-remove='subtask'] {
        opacity: 0.5;
      }
      [data-confirm] {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--secondary-container);
        color: var(--on-secondary-container);
        border: 1px solid var(--outline-variant);
        border-radius: 4px;
        padding: 4px 8px;
        margin-left: 8px;
      }
      [data-confirm-no],
      [data-confirm-yes] {
        background: transparent;
        border: none;
        cursor: pointer;
        padding: 2px 6px;
        font-size: 12px;
        font-weight: 500;
        border-radius: 3px;
      }
      [data-confirm-yes] {
        background: var(--error-container);
        color: var(--on-error-container);
      }
      /* Add subtask affordance + inline input */
      [data-add-subtask] {
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        color: var(--outline);
        padding: 4px;
        cursor: pointer;
        user-select: none;
        align-self: flex-start;
      }
      [data-add-subtask]:hover {
        color: var(--on-surface);
      }
      [data-task][data-kind='simple'] > [data-add-subtask] {
        margin-left: 90px;
        margin-bottom: 8px;
      }
      [data-add-subtask-input] {
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        padding: 4px 8px;
        border: 1px solid var(--outline-variant);
        border-radius: 4px;
        background: var(--surface-container-lowest);
        outline: none;
        align-self: flex-start;
      }
      [data-task][data-kind='simple'] > [data-add-subtask-input] {
        margin-left: 90px;
        margin-bottom: 8px;
      }
      /* Add-task affordance below the bordered task card */
      [data-add-task] {
        display: inline-flex;
        align-self: flex-start;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        color: var(--outline);
        padding: 8px 0;
        margin-top: 8px;
        cursor: pointer;
        user-select: none;
      }
      [data-add-task]:hover {
        color: var(--on-surface);
      }
      [data-add-task-input] {
        align-self: flex-start;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        padding: 8px 12px;
        margin-top: 8px;
        border: 1px solid var(--outline-variant);
        border-radius: 4px;
        background: var(--surface-container-lowest);
        outline: none;
        width: min(360px, 100%);
      }
      /* Command bar — desktop-layout: pinned to the bottom of the main pane,
         spanning the pane width (no longer a centered overlay). The sticky
         position keeps it pinned as the pane scrolls. */
      [data-command-bar] {
        position: sticky;
        bottom: 0;
        margin-top: auto;
        width: 100%;
        max-width: none;
        background: var(--surface-container-lowest);
        border: 1px solid var(--outline-variant);
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        padding: 16px;
        display: flex;
        align-items: center;
        gap: 16px;
        z-index: 50;
      }
      [data-command-bar] [data-icon='bolt'] {
        color: var(--primary);
      }
      [data-command-bar-fields] {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
        overflow: hidden;
      }
      [data-command-chip] {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 6px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 500;
      }
      [data-command-chip='mention'] {
        background: var(--secondary-container);
        color: var(--on-secondary-container);
      }
      [data-command-chip='tag'] {
        background: var(--surface-variant);
        color: var(--on-surface-variant);
        border: 1px solid var(--outline-variant);
      }
      [data-command-bar] input[type='text'] {
        background: transparent;
        border: none;
        outline: none;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        color: var(--on-surface);
        flex: 1;
        min-width: 50px;
      }
      [data-command-bar] input[type='text']::placeholder {
        color: var(--on-surface-variant);
      }
      [data-shortcut-hint] {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-family: monospace;
        font-size: 12px;
        color: var(--on-surface-variant);
        background: var(--surface-container-low);
        border: 1px solid var(--outline-variant);
        border-radius: 4px;
        padding: 4px 6px;
      }
      /* Chat thread (the [data-chat-view] slot styles live with [data-main-view]
         above — both share the same grid slot). */
      [data-chat-thread] {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      [data-message] {
        display: inline-flex;
        align-items: center;
        padding: 8px 12px;
        border-radius: 0.25rem;
        font-size: 14px;
        max-width: 80%;
      }
      [data-message='user'] {
        align-self: flex-end;
        background: var(--secondary-container);
        color: var(--on-secondary-container);
      }
      [data-message='assistant'] {
        align-self: flex-start;
        background: var(--surface-container-low);
        color: var(--on-surface);
      }
      [data-message='assistant'][data-pending]::after {
        content: '...';
        color: var(--on-surface-variant);
      }
      [data-message='assistant'][data-error] {
        background: var(--error-container);
        color: var(--on-error-container);
        border-radius: 0.25rem;
      }
      [data-message='assistant'][data-error] [data-message-text] {
        color: var(--on-error-container);
      }
      /* Tool rows (ollama-tools): inline between user + final assistant
         bubble. Smaller, left-aligned, monospace summary line plus optional
         error-text child. */
      [data-message='tool'] {
        align-self: flex-start;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        background: var(--surface-container-low);
        border: 1px solid var(--outline-variant);
        border-radius: 0.25rem;
        font-size: 12px;
        max-width: 80%;
      }
      [data-message='tool'][data-tool-status='ok']::before {
        content: '✓ ';
        color: #16a34a;
        font-weight: 700;
      }
      [data-message='tool'][data-tool-status='error']::before {
        content: '✗ ';
        color: #ba1a1a;
        font-weight: 700;
      }
      [data-tool-action] {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        color: var(--on-surface);
      }
      [data-tool-error] {
        font-size: 12px;
        color: #ba1a1a;
        margin-left: 8px;
      }
      /* Vault picker */
      [data-vault-picker] {
        display: flex;
        flex-direction: column;
        gap: 16px;
        max-width: 480px;
        margin: 32px auto;
        padding: 32px;
        background: var(--surface-container-lowest);
        border: 1px solid var(--outline-variant);
        border-radius: 0.5rem;
      }
      [data-vault-picker-heading] {
        font-family: 'Inter', sans-serif;
        font-size: 24px;
        font-weight: 600;
        margin: 0 0 8px 0;
        letter-spacing: -0.01em;
        color: var(--primary);
      }
      [data-vault-picker-actions] {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      [data-vault-picker-actions] button {
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        font-weight: 500;
        padding: 10px 16px;
        border-radius: 4px;
        cursor: pointer;
        border: 1px solid var(--outline-variant);
      }
      [data-vault-picker-create] {
        background: var(--primary);
        color: var(--on-primary);
        border-color: var(--primary);
      }
      [data-vault-picker-open] {
        background: var(--surface-container-lowest);
        color: var(--on-surface);
      }
      [data-recents-header] {
        font-family: 'Inter', sans-serif;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: var(--on-surface-variant);
        margin: 24px 0 8px 0;
        text-transform: uppercase;
      }
      [data-recents] {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
      }
      [data-recent-row] {
        display: flex;
        flex-direction: column;
        padding: 8px 0;
        border-bottom: 1px solid var(--outline-variant);
        cursor: pointer;
        position: relative;
      }
      [data-recent-row]:hover {
        background: var(--surface-container-low);
      }
      [data-recent-row] [data-recent-name] {
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        color: var(--on-surface);
      }
      [data-recent-row] [data-recent-path] {
        font-family: monospace;
        font-size: 12px;
        line-height: 1;
        color: var(--on-surface-variant);
        margin-top: 2px;
      }
      [data-recent-row] [data-remove-recent] {
        position: absolute;
        right: 8px;
        top: 50%;
        transform: translateY(-50%);
        background: transparent;
        border: none;
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
        width: 16px;
        height: 16px;
        padding: 0;
        opacity: 0;
        color: var(--on-surface-variant);
      }
      [data-recent-row]:hover [data-remove-recent] {
        opacity: 1;
      }
      [data-open-another-vault] {
        position: absolute;
        right: 24px;
        top: 16px;
        z-index: 10;
        width: 32px;
        height: 32px;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 0.25rem;
        cursor: pointer;
        color: var(--on-surface);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      [data-open-another-vault]:hover {
        border-color: var(--outline);
      }
      /* Settings icon button (top app bar) */
      [data-app-bar-settings] {
        width: 32px;
        height: 32px;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 0.25rem;
        cursor: pointer;
        color: var(--on-surface);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      [data-app-bar-settings]:hover {
        border-color: var(--outline);
      }
      /* Settings panel dropdown */
      [data-settings-panel] {
        position: absolute;
        min-width: 240px;
        background: var(--surface-container-lowest);
        border: 1px solid var(--outline-variant);
        border-radius: 0.375rem;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 100;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      }
      [data-setting-toggle] {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        font-weight: 400;
        color: var(--on-surface);
        cursor: pointer;
        user-select: none;
      }
      [data-setting-toggle] input[type='checkbox'] {
        margin: 0;
        width: 16px;
        height: 16px;
        accent-color: var(--primary);
        cursor: pointer;
      }
      /* Tag autocomplete dropdown. The dropdown is appended as a sibling of
         the command-bar <input> (inputs cannot host children), inside
         [data-command-bar-fields]. That fields container has overflow:hidden,
         so the dropdown anchors to the command bar itself by sitting in its
         own absolutely-positioned box that escapes the fields' clip via the
         command-bar's stacking context. Keyboard-only — no JS hover
         handlers; CSS :hover is feedback only. */
      [data-command-bar-fields] {
        position: relative;
        overflow: visible;
      }
      [data-autocomplete] {
        position: absolute;
        bottom: calc(100% + 12px);
        left: 0;
        min-width: 200px;
        max-width: 100%;
        max-height: 280px;
        overflow-y: auto;
        background: var(--surface-container-lowest);
        border: 1px solid var(--outline-variant);
        border-radius: 0.375rem;
        padding: 4px 0;
        z-index: 60;
      }
      [data-autocomplete-suggestion] {
        display: block;
        padding: 8px 12px;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        font-weight: 400;
        color: var(--on-surface);
        cursor: default;
        border-left: 2px solid transparent;
        user-select: none;
      }
      [data-autocomplete-suggestion]:hover {
        background: var(--surface-container-low);
      }
      [data-autocomplete-suggestion][data-autocomplete-active] {
        background: var(--surface-container-low);
        border-left-color: var(--primary);
      }
      [data-autocomplete-label] {
        font-size: 14px;
        color: var(--on-surface);
      }
      /* Today list */
      [data-today-list] {
        display: flex;
        flex-direction: column;
      }
      [data-today-row] {
        display: flex;
        align-items: center;
        padding: 8px 16px;
        gap: 8px;
        border-bottom: 1px solid var(--surface-container-highest);
      }
      [data-today-row]:last-of-type {
        border-bottom: none;
      }
      [data-today-row]:hover {
        background: var(--surface-container-low);
      }
      [data-today-row] [data-checkbox-wrapper] {
        position: relative;
        width: 18px;
        height: 18px;
        margin-right: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      [data-today-row] [data-checkbox-wrapper] input[type='checkbox'] {
        margin: 0;
        width: 18px;
        height: 18px;
        accent-color: var(--primary);
      }
      [data-today-row] [data-task-title] {
        flex: 1;
        font-size: 14px;
        color: var(--on-surface);
      }
      [data-today-row] [data-remove-from-today] {
        opacity: 0;
        cursor: pointer;
        color: var(--outline);
        display: inline-flex;
        align-items: center;
        padding: 4px;
        border-radius: 4px;
        font-size: 18px;
        flex-shrink: 0;
      }
      [data-today-row]:hover [data-remove-from-today] {
        opacity: 0.6;
      }
      [data-today-row] [data-remove-from-today]:hover {
        opacity: 1;
        color: var(--on-surface);
      }
      [data-today-empty] {
        color: var(--on-surface-variant);
        font-size: 14px;
        padding: 16px 0;
        margin: 0;
      }
      /* Add-to-today icon: hidden by default, revealed on task row hover */
      [data-add-to-today] {
        opacity: 0;
        cursor: pointer;
        color: var(--on-surface-variant);
        display: inline-flex;
        align-items: center;
        padding: 4px;
        border-radius: 4px;
        transition: opacity 100ms;
        flex-shrink: 0;
      }
      [data-task-row]:hover [data-add-to-today],
      [data-add-to-today]:focus {
        opacity: 1;
      }
      [data-add-to-today]:hover {
        color: var(--primary);
      }
      /* Clear all — thin link under the Today headline */
      [data-today-clear-all] {
        background: none;
        border: none;
        padding: 0;
        margin: 4px 0 0 0;
        font-family: 'Inter', sans-serif;
        font-size: 12px;
        color: var(--outline);
        cursor: pointer;
        text-decoration: underline;
        text-decoration-color: var(--outline-variant);
        display: inline;
      }
      [data-today-clear-all]:hover {
        color: var(--on-surface);
      }
      /* Upcoming deadlines view */
      [data-upcoming-list] {
        display: flex;
        flex-direction: column;
      }
      [data-upcoming-row] {
        display: flex;
        flex-direction: column;
        padding: 8px 0;
        border-bottom: 1px solid var(--outline-variant);
      }
      [data-due-row] {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 2px;
        font-size: 12px;
        color: var(--on-surface-variant);
      }
      [data-due-row] .material-symbols-outlined {
        font-size: 14px;
        line-height: 1;
        color: inherit;
      }
      [data-due-row] [data-tag-chip] {
        font-size: 11px;
        background: var(--surface-container);
        color: var(--on-surface-variant);
        padding: 1px 6px;
        border-radius: 4px;
      }
      [data-upcoming-empty] {
        color: var(--on-surface-variant);
        font-size: 14px;
        padding: 24px 0;
      }
      [data-focus-board] {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        padding: 16px 0;
      }
      [data-focus-card] {
        width: 160px;
        min-height: 160px;
        display: flex;
        flex-direction: column;
        padding: 16px;
        background: var(--surface-container-low);
        border: 1px solid var(--outline-variant);
        border-radius: 8px;
        cursor: pointer;
        position: relative;
      }
      [data-focus-card]:hover {
        background: var(--surface-container);
        border-color: var(--outline);
      }
      [data-focus-edit],
      [data-focus-delete] {
        position: absolute;
        top: 8px;
        opacity: 0;
        display: inline-flex;
        padding: 2px;
        border-radius: 3px;
        color: var(--outline);
        cursor: pointer;
      }
      [data-focus-edit] { right: 8px; }
      [data-focus-delete] { right: 32px; }
      [data-focus-edit] .material-symbols-outlined,
      [data-focus-delete] .material-symbols-outlined { font-size: 16px; }
      [data-focus-card]:hover [data-focus-edit],
      [data-focus-card]:hover [data-focus-delete] { opacity: 0.5; }
      [data-focus-edit]:hover { opacity: 1; color: var(--on-surface); background: var(--surface-container); }
      [data-focus-delete]:hover { opacity: 1; color: var(--error); background: var(--surface-container); }
      [data-focus-form] {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
      }
      [data-focus-edit-name],
      [data-focus-edit-tags] {
        width: 100%;
        font-size: 14px;
        border: 1px solid var(--outline-variant);
        border-radius: 4px;
        padding: 6px 8px;
        background: var(--surface-container-lowest);
        color: var(--on-surface);
        margin-bottom: 8px;
        box-sizing: border-box;
      }
      [data-focus-edit-name] { font-weight: 600; }
      [data-focus-edit-actions] {
        display: flex;
        gap: 6px;
        margin-top: 2px;
      }
      [data-focus-save],
      [data-focus-cancel] {
        flex: 1;
        font-size: 13px;
        padding: 4px 0;
        border-radius: 4px;
        border: 1px solid var(--outline-variant);
        cursor: pointer;
      }
      [data-focus-save] {
        background: var(--primary);
        color: var(--on-primary);
        border-color: var(--primary);
      }
      [data-focus-cancel] {
        background: transparent;
        color: var(--on-surface-variant);
      }
      [data-focus-name] {
        font-size: 14px;
        font-weight: 600;
        color: var(--on-surface);
        margin-bottom: 8px;
      }
      [data-focus-tag] {
        display: inline-block;
        font-size: 11px;
        background: var(--surface-container);
        color: var(--on-surface-variant);
        padding: 2px 6px;
        border-radius: 4px;
        margin: 2px 2px 0 0;
      }
      [data-focus-empty] {
        width: 100%;
        color: var(--on-surface-variant);
        font-size: 14px;
        padding: 4px 0 12px;
      }
      [data-create-focus] {
        width: 160px;
        min-height: 160px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        border: 1.5px dashed var(--outline-variant);
        border-radius: 8px;
        color: var(--on-surface-variant);
        font-size: 13px;
        cursor: pointer;
      }
      [data-create-focus]:hover {
        border-color: var(--outline);
        color: var(--on-surface);
        background: var(--surface-container-low);
      }
      [data-focus-task-list] {
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <script src="./index.bundle.js"></script>
  </body>
</html>
