<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>todoz</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --surface: #f7f9fb;
        --surface-bright: #f7f9fb;
        --surface-container-lowest: #ffffff;
        --surface-container-low: #f2f4f6;
        --surface-container: #eceef0;
        --surface-container-high: #e6e8ea;
        --surface-container-highest: #e0e3e5;
        --surface-variant: #e0e3e5;
        --on-surface: #191c1e;
        --on-surface-variant: #4c4546;
        --outline-variant: #cfc4c5;
        --primary: #000000;
        --on-primary: #ffffff;
        --secondary-container: #d0e1fb;
        --on-secondary-container: #54647a;
        --error-container: #ffdad6;
        --on-error-container: #93000a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--surface);
        color: var(--on-surface);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined';
        font-weight: normal;
        font-style: normal;
        font-size: 20px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        font-feature-settings: 'liga';
      }
      [data-app-shell] {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      /* Top app bar */
      [data-app-bar] {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 64px;
        padding: 0 24px;
        background: var(--surface);
        border-bottom: 1px solid var(--outline-variant);
        max-width: 1024px;
        width: 100%;
        margin: 0 auto;
      }
      [data-brand] {
        font-family: 'Inter', sans-serif;
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--primary);
      }
      [data-app-bar-actions] {
        display: flex;
        align-items: center;
        gap: 16px;
      }
      [data-app-bar-actions] button {
        background: transparent;
        border: none;
        cursor: pointer;
        padding: 8px;
        border-radius: 4px;
        color: var(--on-surface);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      [data-app-bar-actions] button:hover {
        background: var(--surface-container-low);
      }
      [data-avatar] {
        width: 32px;
        height: 32px;
        border-radius: 9999px;
        background: var(--surface-variant);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--on-surface-variant);
      }
      /* App body grid */
      [data-app-body] {
        display: flex;
        flex: 1;
        gap: 32px;
        padding: 24px 24px 32px 24px;
        max-width: 1024px;
        width: 100%;
        margin: 0 auto;
        position: relative;
      }
      /* Sidebar */
      [data-sidebar] {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 240px;
        flex-shrink: 0;
      }
      a[data-nav-entry] {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 8px 16px;
        border-radius: 4px;
        color: var(--on-surface);
        text-decoration: none;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.02em;
      }
      [data-nav-entry]:hover {
        background: var(--surface-container-low);
      }
      [data-nav-entry][data-nav-active],
      [data-sidebar-entry][data-nav-active] {
        background: var(--surface-container-low);
        color: var(--primary);
        font-weight: 700;
      }
      [data-sidebar-entry] {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 8px 16px;
        border-radius: 4px;
        text-decoration: none;
        color: var(--on-surface);
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
      }
      [data-sidebar-entry]:hover {
        background: var(--surface-container-low);
      }
      [data-sidebar-entry][data-pulsing='true'] {
        background: var(--secondary-container);
        color: var(--on-secondary-container);
        transition: background 600ms ease, color 600ms ease;
      }
      [data-nav-entry] .material-symbols-outlined {
        font-size: 20px;
      }
      [data-section] {
        margin-top: 16px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      [data-section-entry] {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 8px 16px;
        border-radius: 4px;
        text-decoration: none;
        color: var(--on-surface);
        font-size: 12px;
        font-weight: 500;
      }
      [data-section-entry]:hover {
        background: var(--surface-container-low);
      }
      [data-section-entry] .material-symbols-outlined {
        font-size: 20px;
        color: var(--on-surface-variant);
      }
      [data-section-header] {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--on-surface-variant);
        padding: 0 16px;
        margin: 0 0 8px 0;
      }
      /* Main */
      [data-main] {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 24px;
        min-width: 0;
        padding-bottom: 96px;
      }
      [data-main-header] {
        border-bottom: 1px solid var(--outline-variant);
        padding-bottom: 8px;
        margin-bottom: 8px;
      }
      [data-main-header] h1 {
        font-family: 'Inter', sans-serif;
        font-size: 32px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.2;
        margin: 0 0 4px 0;
        color: var(--primary);
      }
      [data-remaining-count] {
        font-size: 14px;
        color: var(--on-surface-variant);
        margin: 0;
      }
      /* Task card */
      [data-task-card] {
        display: flex;
        flex-direction: column;
        border: 1px solid var(--outline-variant);
        border-radius: 4px;
        background: var(--surface-container-lowest);
      }
      [data-task-list] {
        list-style: none;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
      }
      [data-group-heading] {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--on-surface-variant);
        padding: 16px 16px 8px 16px;
        margin: 0;
      }
      [data-task] {
        display: flex;
        flex-direction: column;
        border-bottom: 1px solid var(--surface-container-highest);
      }
      [data-task]:last-child {
        border-bottom: none;
      }
      [data-task][data-expanded='true'] {
        background: var(--surface-bright);
      }
      [data-task-row] {
        display: flex;
        align-items: center;
        padding: 8px 16px;
        gap: 8px;
        cursor: pointer;
      }
      [data-task-row]:hover {
        background: var(--surface-container-low);
      }
      [data-chevron] {
        color: var(--on-surface-variant);
        font-size: 20px;
        line-height: 1;
        display: inline-flex;
      }
      [data-task] [data-task-row] [data-checkbox-wrapper] {
        position: relative;
        width: 18px;
        height: 18px;
        margin-right: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      [data-task] [data-task-row] [data-checkbox-wrapper] input[type='checkbox'] {
        margin: 0;
        width: 18px;
        height: 18px;
        accent-color: var(--primary);
      }
      [data-task-title] {
        flex: 1;
        font-size: 14px;
        color: var(--on-surface);
      }
      [data-task-status='done'] [data-task-title] {
        text-decoration: line-through;
        color: var(--on-surface-variant);
      }
      [data-chip] {
        display: inline-flex;
        align-items: center;
        padding: 4px 6px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.02em;
        background: var(--surface-variant);
        color: var(--on-surface-variant);
        border: 1px solid var(--outline-variant);
      }
      [data-chip][data-chip-priority='high'] {
        background: var(--error-container);
        color: var(--on-error-container);
        border: none;
      }
      [data-chip][data-chip-priority='medium'] {
        background: var(--secondary-container);
        color: var(--on-secondary-container);
        border: none;
      }
      [data-task-due] {
        font-size: 12px;
        color: var(--on-surface-variant);
        margin-right: 8px;
      }
      /* Subtasks */
      [data-subtasks] {
        list-style: none;
        padding: 0 16px 8px 64px;
        margin: 0 0 0 26px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      [data-subtasks][data-guide-line] {
        border-left: 2px solid var(--surface-container-highest);
      }
      [data-subtask] {
        display: flex;
        align-items: center;
        padding: 4px;
        border-radius: 4px;
        gap: 8px;
      }
      [data-subtask]:hover {
        background: var(--surface-container-low);
      }
      [data-subtask] input[type='checkbox'] {
        width: 16px;
        height: 16px;
        margin: 0;
        accent-color: var(--on-surface-variant);
      }
      [data-subtask-label] {
        font-size: 13px;
        color: var(--on-surface);
      }
      [data-subtask-label][data-strikethrough='true'] {
        text-decoration: line-through;
        color: var(--on-surface-variant);
      }
      [data-task-title][data-completed='true'] {
        text-decoration: line-through;
        color: var(--on-surface-variant);
      }
      [data-subtask-title][data-completed='true'] {
        text-decoration: line-through;
        color: var(--on-surface-variant);
      }
      [data-checkbox-wrapper][data-checked='true'] {
        background-color: #16a34a;
        border-radius: 3px;
      }
      [data-checkbox-wrapper][data-checked='true'] input[type='checkbox'] {
        accent-color: #16a34a;
      }
      [data-task][data-expanded='true'] [data-chevron] {
        transform: rotate(90deg);
      }
      [data-remove] {
        font-size: 12px;
        color: var(--outline-variant);
        padding: 4px;
        opacity: 0.6;
        cursor: pointer;
        user-select: none;
        margin-left: 8px;
      }
      [data-remove]:hover {
        opacity: 1;
      }
      [data-confirm] {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--secondary-container);
        color: var(--on-secondary-container);
        border: 1px solid var(--outline-variant);
        border-radius: 4px;
        padding: 4px 8px;
        margin-left: 8px;
      }
      [data-confirm-no],
      [data-confirm-yes] {
        background: transparent;
        border: none;
        cursor: pointer;
        padding: 2px 6px;
        font-size: 12px;
        font-weight: 500;
        border-radius: 3px;
      }
      [data-confirm-yes] {
        background: var(--error-container);
        color: var(--on-error-container);
      }
      /* Command bar */
      [data-command-bar] {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        width: calc(100% - 48px);
        max-width: 600px;
        background: var(--surface-container-lowest);
        border: 1px solid rgba(0, 0, 0, 0.1);
        border-radius: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        padding: 16px;
        display: flex;
        align-items: center;
        gap: 16px;
        z-index: 50;
      }
      [data-command-bar] [data-icon='bolt'] {
        color: var(--primary);
      }
      [data-command-bar-fields] {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
        overflow: hidden;
      }
      [data-command-chip] {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px 6px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 500;
      }
      [data-command-chip='mention'] {
        background: var(--secondary-container);
        color: var(--on-secondary-container);
      }
      [data-command-chip='tag'] {
        background: var(--surface-variant);
        color: var(--on-surface-variant);
        border: 1px solid var(--outline-variant);
      }
      [data-command-bar] input[type='text'] {
        background: transparent;
        border: none;
        outline: none;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        color: var(--on-surface);
        flex: 1;
        min-width: 50px;
      }
      [data-command-bar] input[type='text']::placeholder {
        color: var(--on-surface-variant);
      }
      [data-shortcut-hint] {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-family: monospace;
        font-size: 12px;
        color: var(--on-surface-variant);
        background: var(--surface-container-low);
        border: 1px solid var(--outline-variant);
        border-radius: 4px;
        padding: 4px 6px;
      }
    </style>
  </head>
  <body>
    <script src="./index.bundle.js"></script>
  </body>
</html>
